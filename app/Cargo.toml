[package]
name = "app"
version = "0.1.0"
edition = "2024"

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_10", "v1_6"] }
gettext-rs = { version = "0.8.0", features = ["gettext-system"] }
gtk = { version = "0.11.5", package = "gtk4", features = ["blueprint", "v4_24"] }
oo7 = "0.6.0"
rusqlite = "0.40.2"
subsonic = { version = "0.1.0", path = "../subsonic" }
tokio = { version = "1.53.1", features = ["fs", "rt-multi-thread", "sync"] }

[[bin]]
name = "muse-player"
path = "src/main.rs"
