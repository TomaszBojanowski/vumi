[package]
name = "subsonic"
version = "0.1.3"
license = "GPL-3.0-or-later"
repository = "https://github.com/TomaszBojanowski/vumi"
edition = "2024"

[dependencies]
getrandom = "0.3"
md5 = "0.8.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt"] }
wiremock = "0.6.5"
