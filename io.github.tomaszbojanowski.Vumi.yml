# Development manifest (local builds only, uses network during build).
id: io.github.tomaszbojanowski.Vumi
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: vumi
finish-args:
  - --own-name=org.mpris.MediaPlayer2.io.github.tomaszbojanowski.Vumi
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  build-args:
    - --share=network
  env:
    CARGO_HOME: /run/build/vumi/cargo
modules:
  - name: vumi
    buildsystem: meson
    builddir: true
    sources:
      - type: dir
        path: .
        skip:
          - target
          - flatpak-build
          - .flatpak-builder
          - website
